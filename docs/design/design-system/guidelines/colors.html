<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colours</title>
<link rel="stylesheet" href="../styles.css">
<style>
main { padding: 24px; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.sw span { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--color-border); }
.sw b { font-weight: 400; font-size: 15px; }
.sw i { font: var(--text-label); color: var(--color-text-muted); font-style: normal; }
p { margin: 0; }
</style>
</head>
<body>
<main>
<h1 class="heading">Colours</h1>
<p class="meta">Dark only. Eight colours. Red means recording and nothing else.</p>
<div class="grid">
<div class="sw"><span style="background: var(--color-surface)"></span><b>surface</b><i>screen</i></div>
<div class="sw"><span style="background: var(--color-surface-raised)"></span><b>surface.raised</b><i>card, sheet, row</i></div>
<div class="sw"><span style="background: var(--color-text)"></span><b>text</b><i>body</i></div>
<div class="sw"><span style="background: var(--color-text-muted)"></span><b>text.muted</b><i>meta, labels</i></div>
<div class="sw"><span style="background: var(--color-accent)"></span><b>accent</b><i>primary action, dark text on it</i></div>
<div class="sw"><span style="background: var(--color-recording)"></span><b>recording</b><i>recording only</i></div>
<div class="sw"><span style="background: var(--color-ok)"></span><b>ok</b><i>saved</i></div>
<div class="sw"><span style="background: var(--color-border)"></span><b>border</b><i>hairlines</i></div>
</div>
</main>
</body>
</html>
