<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round controls</title>
<link rel="stylesheet" href="../styles.css">
<style>
main { padding: 24px; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.sw span { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--color-border); }
.sw b { font-weight: 400; font-size: 15px; }
.sw i { font: var(--text-label); color: var(--color-text-muted); font-style: normal; }
p { margin: 0; }
</style>
</head>
<body>
<main>
<h1 class="heading">Round controls</h1>
<div style="display: flex; gap: 24px"><div class="control-wrap"><button class="control control-record" aria-label="Record"></button><span class="label">Record</span></div><div class="control-wrap"><button class="control control-stop" aria-label="Stop"></button><span class="label">Stop</span></div><div class="control-wrap"><button class="control control-record big" aria-label="Record"></button><span class="label">Idle screen</span></div></div>
</main>
</body>
</html>
