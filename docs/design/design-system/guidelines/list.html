<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting list</title>
<link rel="stylesheet" href="../styles.css">
<style>
main { padding: 24px; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.sw span { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--color-border); }
.sw b { font-weight: 400; font-size: 15px; }
.sw i { font: var(--text-label); color: var(--color-text-muted); font-style: normal; }
p { margin: 0; }
</style>
</head>
<body>
<main>
<h1 class="heading">Meeting list</h1>
<div class="stack" style="gap: 8px"><a class="card row" href="#"><div style="display: flex; justify-content: space-between; align-items: center"><b>Raslaw weekly sync</b><span class="badge">Transcribing</span></div><span class="meta">Today · 48 min</span></a><a class="card row" href="#"><b>DirtArmy sprint review</b><span class="meta">Mon 6 Oct · 1 h 12 min</span></a><div class="card" style="text-align: center"><b>No meetings yet</b><div class="meta">Tap record at the start of your next one.</div></div></div>
</main>
</body>
</html>
