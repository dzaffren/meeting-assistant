<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toasts and saved</title>
<link rel="stylesheet" href="../styles.css">
<style>
main { padding: 24px; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.sw span { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--color-border); }
.sw b { font-weight: 400; font-size: 15px; }
.sw i { font: var(--text-label); color: var(--color-text-muted); font-style: normal; }
p { margin: 0; }
</style>
</head>
<body>
<main>
<h1 class="heading">Toasts and saved</h1>
<div class="stack"><div class="toast"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Notes ready</div><div class="toast toast-error"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-recording)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>Couldn't transcribe. Audio is safe, try again.</div></div>
</main>
</body>
</html>
