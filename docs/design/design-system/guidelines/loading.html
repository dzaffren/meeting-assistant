<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading</title>
<link rel="stylesheet" href="../styles.css">
<style>
main { padding: 24px; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.sw span { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--color-border); }
.sw b { font-weight: 400; font-size: 15px; }
.sw i { font: var(--text-label); color: var(--color-text-muted); font-style: normal; }
p { margin: 0; }
</style>
</head>
<body>
<main>
<h1 class="heading">Loading</h1>
<div class="card" style="display: flex; gap: 12px; align-items: center"><span class="skeleton" style="width: 10px; height: 10px; border-radius: 999px; background: var(--color-accent)"></span>Transcribing. Usually under 5 minutes.</div><div class="stack" style="margin-top: 16px"><div class="skeleton" style="width: 38%; height: 22px"></div><div class="skeleton" style="height: 16px"></div><div class="skeleton" style="width: 92%; height: 16px"></div></div>
</main>
</body>
</html>
