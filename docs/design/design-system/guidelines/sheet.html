<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm sheet</title>
<link rel="stylesheet" href="../styles.css">
<style>
main { padding: 24px; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.sw span { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--color-border); }
.sw b { font-weight: 400; font-size: 15px; }
.sw i { font: var(--text-label); color: var(--color-text-muted); font-style: normal; }
p { margin: 0; }
</style>
</head>
<body>
<main>
<h1 class="heading">Confirm sheet</h1>
<div class="scrim"></div><div class="sheet"><div class="sheet-handle"></div><div><p class="heading">Stop and save?</p><p class="meta" style="font: var(--text-body); color: var(--color-text-muted)">Raslaw weekly sync, 48 min. Notes will be ready in a few minutes.</p></div><div class="stack"><button class="btn btn-primary">Stop and save</button><button class="btn btn-secondary" style="background: var(--color-surface)">Keep recording</button></div></div>
</main>
</body>
</html>
