# Scenario 1 of docs/specs/walking-skeleton.md: record a meeting and save it.
appId: com.dzafran.meetingassistant
---
- launchApp:
    clearState: true
    permissions:
      microphone: allow
- assertVisible:
    id: screen-list
- tapOn:
    id: record
- assertVisible:
    id: screen-name
- assertVisible: "Recording is for your own notes. Tell the room."
- tapOn:
    id: meeting-name
- inputText: "Raslaw weekly sync"
- tapOn:
    id: start-recording
- assertVisible:
    id: screen-recording
- assertVisible: "Raslaw weekly sync"
- assertNotVisible: "Meetings"
- extendedWaitUntil:
    visible:
      id: stop
    timeout: 5000
- tapOn:
    id: stop
- assertVisible: "Stop and save?"
- tapOn:
    id: stop-and-save
- assertVisible: "Saved"
- assertVisible:
    text: "Raslaw weekly sync · .* s"
- extendedWaitUntil:
    visible:
      id: screen-list
    timeout: 4000
- assertVisible: "Raslaw weekly sync"
- assertVisible:
    text: "Today · .* s"
